<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RD24001 IMO JSON API</title><style>body{font-family:system-ui,sans-serif;max-width:1080px;margin:40px auto;padding:0 20px;line-height:1.55}code,pre{background:#f4f4f4;padding:2px 5px;border-radius:4px}pre{padding:12px;overflow:auto}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px;text-align:left}a{color:#0645ad}</style></head><body><h1>RD24001 IMO Compendium JSON Sample API</h1><p>FAL.5/Circ.56 기반의 <strong>가상 시험 데이터</strong>입니다. 공식 IMO normative JSON 메시지가 아닙니다.</p><p><a href="api/v1/index.json">API metadata</a> · <a href="api/v1/ships/index.json">Ships</a> · <a href="api/v1/datasets/index.json">Datasets</a> · <a href="openapi.yaml">OpenAPI</a></p><h2>Datasets</h2><div id="datasets">Loading…</div><h2>Ships</h2><div id="ships">Loading…</div><script>async function load(){const d=await fetch('api/v1/datasets/index.json').then(r=>r.json());document.getElementById('datasets').innerHTML='<table><tr><th>Code</th><th>Name</th><th>Samples</th></tr>'+d.datasets.map(x=>`<tr><td>${x.datasetCode}</td><td><a href="api/v1/datasets/${x.datasetSlug}/index.json">${x.datasetName}</a></td><td>${x.sampleCount}</td></tr>`).join('')+'</table>';const s=await fetch('api/v1/ships/index.json').then(r=>r.json());document.getElementById('ships').innerHTML='<table><tr><th>IMO</th><th>Name</th><th>Reports</th></tr>'+s.ships.map(x=>`<tr><td>${x.imo}</td><td>${x.shipName}</td><td><a href="api/v1/ships/${x.imo}/index.json">index.json</a></td></tr>`).join('')+'</table>';}load();</script></body></html>
